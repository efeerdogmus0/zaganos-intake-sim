name: reveal-reels
on:
  workflow_dispatch:
    inputs:
      run_id: {description: 'Yatay videonun bulundugu run id', required: true}
      video: {description: 'Yatay video artifact adi', required: true, default: 'video-v4b'}
      out: {description: 'Cikti adi', required: true, default: 'reels'}
permissions:
  actions: read
  contents: read
jobs:
  reels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.video }}
          path: src
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: ls -la src
      - run: bash ci/get_blender.sh
      - run: |
          curl -sSfL -o f1.ttf https://github.com/google/fonts/raw/main/ofl/barlowcondensed/BarlowCondensed-ExtraBold.ttf
          curl -sSfL -o f2.ttf https://github.com/google/fonts/raw/main/ofl/barlowcondensed/BarlowCondensed-SemiBold.ttf
      - env:
          FONT1: ${{ github.workspace }}/f1.ttf
          FONT2: ${{ github.workspace }}/f2.ttf
        run: blender -b --factory-startup --python reveal/vertical.py -- "$(ls $PWD/src/*.mp4 | head -1)" "$PWD/ZAGANOS_OVERLORD_${{ inputs.out }}.mp4" 2>&1 | grep -E "VIDEO|Error|Traceback"
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.out }}
          path: ZAGANOS_OVERLORD_${{ inputs.out }}.mp4
