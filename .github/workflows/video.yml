name: video
on:
  workflow_dispatch:
    inputs:
      scenes:
        description: 'Bosluklu liste, tasarim:sahne (record3.py), orn. K00:c1 K14:rnd31'
        required: true
        default: 'K00:c1 K14:c1 K00:rnd31 K14:rnd31'
      region:
        description: 'Bolge dosyasi'
        required: true
        default: region2_v4.npz
      assemble:
        description: 'Montaj betigi'
        required: true
        default: assemble_kanal.py
      out:
        description: 'Video adi'
        required: true
        default: kanal.mp4
      chunks:
        description: 'Sahne basina paralel dilim'
        required: true
        default: '5'
      samples:
        description: 'Cycles ornek sayisi'
        required: true
        default: '8'
      cands:
        description: 'Optimizasyon adaylari (JSON, istege bagli)'
        required: false
        default: ''
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.m.outputs.list }}
    steps:
      - id: m
        run: echo "list=$(python3 -c "import json,sys; n=int(sys.argv[2]); print(json.dumps([f'{s}:{k}/{n}' for s in sys.argv[1].split() for k in range(n)]))" '${{ inputs.scenes }}' '${{ inputs.chunks }}')" >> $GITHUB_OUTPUT
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        s: ${{ fromJson(needs.plan.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: kayit
        run: |
          S='${{ matrix.s }}'; D=${S%%:*}; R=${S#*:}; T=${R%%:*}; C=${R#*:}
          echo "TAG=${D}_${T}" >> $GITHUB_ENV; echo "CHUNK=$C" >> $GITHUB_ENV; echo "CTAG=${C/\//of}" >> $GITHUB_ENV
          mkdir -p vid/${D}_${T}
          CANDS='${{ inputs.cands }}' SONUC_OUT=vid/${D}_${T}/sonuc.txt REGION=${{ inputs.region }} python record3.py rec.npz $D $T
      - run: bash ci/get_blender.sh
      - name: render
        run: FRAME_CHUNK=$CHUNK CYCLES_SAMPLES=${{ inputs.samples }} RENDER_ENGINE=CYCLES blender -b --factory-startup --python render3.py -- "$PWD" "$PWD/rec.npz" "$PWD/vid/$TAG/f" 4 100 top 2>&1 | grep -E "KARE|BITTI|Error|Traceback|Blender [0-9]" 
      - run: ls vid/$TAG | wc -l; ls vid/$TAG | head -2
      - uses: actions/upload-artifact@v4
        with:
          name: vid-${{ env.TAG }}-${{ env.CTAG }}
          path: vid
  assemble:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: vid-*
          path: vid
          merge-multiple: true
      - run: ls vid
      - run: bash ci/get_blender.sh
      - env:
          SCENES: ${{ inputs.scenes }}
          CANDS: ${{ inputs.cands }}
        run: blender -b --factory-startup --python ${{ inputs.assemble }} -- "$PWD" "$PWD/${{ inputs.out }}" 2>&1 | grep -E "VIDEO|Error|Traceback"
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: ${{ inputs.out }}
