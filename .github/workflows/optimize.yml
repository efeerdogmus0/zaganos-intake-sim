name: optimize
on:
  workflow_dispatch:
    inputs:
      nb1: {description: '1. asama parti (alma orani)', required: true, default: '13'}
      nb2: {description: '2. asama parti (hiz)', required: true, default: '12'}
      batch: {description: 'Parti basina aday', required: true, default: '20'}
      region: {description: 'Bolge', required: true, default: region2_v8.npz}
      dry: {description: 'Kuru deneme (1)', required: false, default: ''}
permissions:
  actions: write
  contents: read
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NB1: ${{ inputs.nb1 }}
      NB2: ${{ inputs.nb2 }}
      BATCH: ${{ inputs.batch }}
      REGION: ${{ inputs.region }}
      DRY: ${{ inputs.dry }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install optuna==4.5.0
      - run: python optimize.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimizasyon
          path: |
            opt.db
            opt_log.json
            dogrulama.json
